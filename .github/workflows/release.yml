name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the project version
        run: |
          version=$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "build.gradle says $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          if [ -z "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" build/libs/SkTyper.jar \
              --title "SkTyper ${GITHUB_REF_NAME#v}" \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" build/libs/SkTyper.jar \
              --title "SkTyper ${GITHUB_REF_NAME#v}" \
              --notes "$notes"
          fi
