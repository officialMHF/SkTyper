# SkTyper links against Typewriter's kotlin-stdlib at runtime and ships none of its own,
# so the Kotlin plugin must not add one as an implementation dependency. See the README.
kotlin.stdlib.default.dependency=false

# The deploy task reads these. Keep real values out of the repo - put them in
# ~/.gradle/gradle.properties, or pass them on the command line with -PftpUser=... etc.
#
# ftpHost=your.host
# ftpPort=21
# ftpUser=
# ftpPassword=
# ftpRemotePath=plugins/SkTyper.jar
